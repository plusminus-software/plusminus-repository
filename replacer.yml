- from: plusminus-repository
  to: ${REPOSITORY_NAME}
  if: "!PATH.includes('.git') && !PATH.includes('.idea')"

- from: Plusminus Repository description
  to: ${REPOSITORY_DESCRIPTION}

- from: |
    <artifactId>plusminus-parent</artifactId>
    <version>1.4-SNAPSHOT</version>
  to: |
    <artifactId>plusminus-parent-public</artifactId>
    <version>1.0-SNAPSHOT</version>
  if: REPOSITORY_PRIVATE == 'false'

- from: repository
  to: |
    js:
    (() => {
      const nameParts = REPOSITORY_NAME.split('-');
      return nameParts.length > 1 ? nameParts[1] : nameParts[0];
    })();
  if: PATH.endsWith('plusminus' + PATH_SEPARATOR + 'repository')
  scopes: [FOLDER_NAME]

- from: software.plusminus.repository
  to: |
    js:
    (() => {
      const nameParts = REPOSITORY_NAME.split('-');
      const name = nameParts.length > 1 ? nameParts[1] : nameParts[0];
      return 'software.plusminus.' + name;
    })();

- from: PlusminusRepository
  to: js:toStudlyCaps(REPOSITORY_NAME)
  scopes: [CONTENT, FILE_NAME]

- from: RepositoryAutoconfig
  to: |
    js:
    (() => {
      const nameParts = REPOSITORY_NAME.split('-')
        .map(word => word.charAt(0).toUpperCase() + word.slice(1));
      const name = nameParts.length > 1 ? nameParts[1] : nameParts[0];
      return name + 'Autoconfig';
    })();
  scopes: [CONTENT, FILE_NAME]

- from: Plusminus Repository
  to: |
    js:
    REPOSITORY_NAME.split('-')
      .map(word => word.charAt(0).toUpperCase() + word.slice(1))
      .join(' ');